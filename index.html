<!doctype html>
<html lang="ku">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>M Downloader</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#060914;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
.app{min-height:100vh;padding:52px 18px 30px;background:radial-gradient(circle at 80% 5%,#263c9a55,transparent 35%),radial-gradient(circle at 15% 35%,#7a28c044,transparent 30%),#060914}
.header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:31px;font-weight:800}.brand span{background:linear-gradient(90deg,#40d9ff,#7c5cff);-webkit-background-clip:text;color:transparent}
.sub{color:#8e96aa;margin-top:5px;font-size:14px}.gear{width:44px;height:44px;border:1px solid #ffffff18;border-radius:15px;background:#ffffff09;color:white;font-size:21px}
.card{margin-top:28px;padding:18px;border:1px solid #ffffff14;border-radius:24px;background:#ffffff09;backdrop-filter:blur(18px);box-shadow:0 18px 50px #0007}
.label{font-size:13px;color:#9da6bc;margin-bottom:10px}.input{display:flex;gap:10px;align-items:center;padding:15px;border-radius:17px;background:#0007;border:1px solid #ffffff12}.input input{flex:1;background:none;border:0;outline:0;color:white;font-size:15px}.input button{background:none;border:0;color:#8f98ac;font-size:18px}
.download{width:100%;border:0;margin-top:15px;padding:16px;border-radius:17px;color:white;font-size:16px;font-weight:700;background:linear-gradient(100deg,#147cff,#744cff);box-shadow:0 12px 30px #345cff55}
.row{display:flex;gap:12px;margin-top:16px}.mini{flex:1;padding:17px;border:1px solid #ffffff12;border-radius:20px;background:#ffffff08}.icon{font-size:25px}.mini b{display:block;margin-top:9px}.mini small{color:#8992a8}
.section{margin-top:27px;font-size:17px;font-weight:700}.apps{display:flex;justify-content:space-between;margin-top:14px}.appicon{text-align:center;color:#aeb6c9;font-size:12px}.bubble{width:52px;height:52px;border-radius:16px;background:#ffffff0b;border:1px solid #ffffff12;display:grid;place-items:center;font-size:22px;margin-bottom:6px}
.status{display:none;margin-top:18px;padding:15px;border-radius:17px;background:#19b66b18;border:1px solid #19b66b44;color:#75e8ad}
.nav{position:fixed;bottom:0;left:0;right:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:#080b16dd;backdrop-filter:blur(20px);display:flex;justify-content:space-around;border-top:1px solid #ffffff12}.nav button{background:none;border:0;color:#7f889d;font-size:12px}.nav button.active{color:#55cfff}
</style>
</head>
<body>
<div class="app">
  <div class="header"><div><div class="brand"><span>M</span> Downloader</div><div class="sub">Save your favorite moments</div></div><button class="gear">⚙︎</button></div>

  <div class="card">
    <div class="label">MEDIA LINK</div>
    <div class="input"><span>🔗</span><input id="link" placeholder="Paste link here…"><button onclick="clearLink()">×</button></div>
    <button class="download" onclick="preview()">↓ &nbsp; Download</button>
    <div id="status" class="status">✓ Link آماده‌یه بۆ preview. دەتوانین media ـی ڕێگەپێدراو دابگریین.</div>
  </div>

  <div class="row">
    <div class="mini"><div class="icon">🎥</div><b>Video</b><small>High quality</small></div>
    <div class="mini"><div class="icon">🖼️</div><b>Image</b><small>High quality</small></div>
  </div>

  <div class="section">Popular Apps</div>
  <div class="apps">
    <div class="appicon"><div class="bubble">◎</div>Instagram</div>
    <div class="appicon"><div class="bubble">♪</div>TikTok</div>
    <div class="appicon"><div class="bubble">▶</div>YouTube</div>
    <div class="appicon"><div class="bubble">f</div>Facebook</div>
  </div>
</div>
<div class="nav"><button class="active">⌂<br>Home</button><button>↓<br>Downloads</button><button>⚙<br>Settings</button></div>
<script>
function preview(){const v=document.getElementById('link').value.trim();const s=document.getElementById('status');s.style.display='block';s.textContent=v?'✓ Link آماده‌یه بۆ preview.':'⚠️ تکایە لینکەکە دابنێ.'}
function clearLink(){document.getElementById('link').value='';document.getElementById('status').style.display='none'}
</script>
</body></html>
